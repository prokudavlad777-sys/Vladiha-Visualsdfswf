function fx(x,y,r,big){for(let i=0;i<(big?70:14);i++){const a=Math.random()*TAU,s=Math.random()*r*(big?2.2:3);F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.7,m:1.2,r:4+Math.random()*r*.18,k:'f'})}F.push({x,y,vx:0,vy:0,l:.5,m:.5,r,k:'r'})}

fx(x,y,r);const q=sg.createRadialGradient(x,y,0,x,y,r*.7);q.addColorStop(0,'rgba(20,16,12,.6)');q.addColorStop(1,'rgba(20,16,12,0)');sg.fillStyle=q;sg.fillRect(x-r,y-r,r*2,r*2);shake=Math.max(shake,Math.min(30,r/6))}
function steer(u,a,tr,dt){u.a+=Math.max(-tr*dt,Math.min(tr*dt,ang(a,u.a)))}

const fwd=(u,s,dt)=>{u.x+=Math.cos(u.a)*s*dt;u.y+=Math.sin(u.a)*s*dt};
function upd(u,dt){const T=TY[u.k],o=hq[1-u.s];u.cd-=dt;u.t+=dt;

if(!u.w&&ds(u,tg)<230){u.w=1;snd('shwhistle',u.x)}steer(u,Math.atan2(tg.y-u.y,tg.x-u.x),3.5,dt);fwd(u,T.s,dt);if(ds(u,tg)<22){boom(u.x,u.y,55,90,u.s,0);u.hp=0}return}
let tg=null,bd=T.r;for(const e of U)if(e.s!==u.s&&(T.hitA||TY[e.k].dom!=='a')){const d=ds(u,e);if(d<bd){bd=d;tg=e}}
if(!tg&&ds(u,o)<T.r)tg=o;
if(T.dom==='g'){if(tg){const a=Math.atan2(tg.y-u.y,tg.x-u.x);u.ta+=Math.max(-3*dt,Math.min(3*dt,ang(a,u.ta)));if(u.cd<=0&&Math.abs(ang(a,u.ta))<.1)shoot(u,tg,T)}
else{const a=flow(u,D[1-u.s]);if(a!==null){steer(u,a,2.5,dt);fwd(u,T.s,dt);u.ta+=ang(u.a,u.ta)*Math.min(1,4*dt);const cx=Math.cos(u.a),cy=Math.sin(u.a);if(Math.random()<.5)F.push({x:u.x-cx*16,y:u.y-cy*16,vx:0,vy:0,l:.8,m:.8,r:3,k:'d'});sg.fillStyle='rgba(25,20,12,.12)';for(const q of[-12,12])sg.fillRect(u.x-cx*10-cy*q-1,u.y-cy*10+cx*q-1,2,2)}}return}
let sk=tg;if(!sk){let b=700;for(const e of U)if(e.s!==u.s&&(T.hitA||TY[e.k].dom!=='a')){const d=ds(u,e);if(d<b){b=d;sk=e}}}if(!sk)sk=o;
steer(u,Math.atan2(sk.y-u.y,sk.x-u.x),T.tr,dt);if(!T.hov||ds(u,sk)>T.r*.75)fwd(u,T.s,dt);if(!T.hov&&Math.random()<.6)F.push({x:u.x-Math.cos(u.a)*20,y:u.y-Math.sin(u.a)*20,vx:0,vy:0,l:.6,m:.6,r:2,k:'s'});
if(tg&&u.cd<=0&&Math.abs(ang(Math.atan2(tg.y-u.y,tg.x-u.x),u.a))<.3)shoot(u,tg,T);
if(u.x<20||u.x>W-20||u.y<20||u.y>H-20)steer(u,Math.atan2(H/2-u.y,W/2-u.x),T.tr*1.5,dt)}
function ai(dt){aiT-=dt;if(aiT>0)return;aiT=(2.2+Math.random()*2.5)/DF[di][1];const m=cash[1];if(m<450&&Math.random()<.4)return;
let l=KEYS.filter(k=>TY[k].c<=m&&(k!=='nuke'||Math.random()<.5));if(!l.length)return;const k=l[Math.random()*l.length|0];
const my=U.filter(u=>u.s===0&&TY[u.k].dom==='g'),c=my.length&&!(k==='nuke'&&Math.random()<.6)?my[Math.random()*my.length|0]:hq[0];

for(const h of hq){h.cd-=dt;if(h.cd<=0){let t=null,bd=320;for(const e of U)if(e.s!==h.s){const d=ds(h,e);if(d<bd){bd=d;t=e}}if(t){h.cd=.45;snd('gun',h.x);P.push({t:'b',x1:h.x,y1:h.y,x2:t.x,y2:t.y,l:.09});t.hp-=9}}}
for(const p of P){if(p.t==='b')p.l-=dt;else if(p.t==='m'){const a=Math.atan2(p.ty-p.y,p.tx-p.x),st=p.v*dt;p.a=a;if(!p.w&&!p.bomb&&Math.hypot(p.tx-p.x,p.ty-p.y)<320){p.w=1;snd('rwhistle',p.x)}
if(Math.hypot(p.tx-p.x,p.ty-p.y)<=st){boom(p.tx,p.ty,p.r,p.d,p.s,0);p.l=0}else{p.x+=Math.cos(a)*st;p.y+=Math.sin(a)*st;F.push({x:p.x-Math.cos(a)*14,y:p.y-Math.sin(a)*14,vx:0,vy:0,l:.7,m:.7,r:4,k:'s'})}}
else{p.l-=dt;if(Math.ceil(p.l)!==p.b){p.b=Math.ceil(p.l);snd('beep',p.tx)}if(p.l<=0){snd('nuke',p.tx);boom(p.tx,p.ty,280,1500,p.s,1);fx(p.tx,p.ty,280,1);flash=1;shake=40}}}
P=P.filter(p=>p.l>0);for(const u of U)if(u.hp<=0&&!TY[u.k].kam){fx(u.x,u.y,22);snd('boom',u.x,30);if(TY[u.k].dom==='g'){sg.fillStyle='rgba(15,12,8,.55)';sg.beginPath();sg.arc(u.x,u.y,15,0,TAU);sg.fill();for(let i=0;i<8;i++)F.push({x:u.x+(Math.random()-.5)*10,y:u.y,vx:(Math.random()-.5)*6,vy:-14-Math.random()*10,l:3+Math.random()*2,m:5,r:5,k:'s'})}}U=U.filter(u=>u.hp>0);
for(const f of F){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96}F=F.filter(f=>f.l>0);
if(hq[1].hp<=0||hq[0].hp<=0){mode='over';showMenu(hq[1].hp<=0?'ПЕРЕМОГА':'ПОРАЗКА','Штаб знищено','Грати знову')}}
function poly(p){g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath()}
function shape(k,c,d,o){g.fillStyle=c;g.strokeStyle=d;g.lineWidth=1.3;g.lineJoin='round';
if(k==='tank'){g.fillStyle=o.ic?c:'#2b3138';g.fillRect(-18,-15,36,6);g.fillRect(-18,9,36,6);g.fillStyle=c;g.beginPath();g.roundRect(-16,-9,32,18,4);g.fill();g.stroke();
g.save();g.rotate(o.ta||0);g.beginPath();g.arc(-2,0,7.5,0,TAU);g.fill();g.stroke();g.fillRect(4,-1.6,25,3.2);g.restore()}
else if(k==='mi24'){g.fillRect(-34,-1.6,22,3.2);g.fillRect(-37,-6,4,12);g.fillRect(-3,-15,7,30);g.beginPath();g.ellipse(0,0,19,6.5,0,0,TAU);g.fill();g.stroke();
if(!o.ic){g.fillStyle='rgba(150,200,255,.75)';g.beginPath();g.ellipse(9,0,6,3.5,0,0,TAU);g.fill()}
g.save();g.rotate((o.t||.6)*16);g.strokeStyle=d;g.lineWidth=2;g.beginPath();g.moveTo(-30,0);g.lineTo(30,0);g.moveTo(0,-30);g.lineTo(0,30);g.stroke();g.restore()}
else if(k==='cab'){g.beginPath();g.ellipse(0,0,15,5.5,0,0,TAU);g.fill();g.stroke();poly([[-11,0],[-19,7],[-15,0],[-19,-7]]);g.fill()}
else if(k==='rocket'){if(!o.ic){g.fillStyle='#ffb347';poly([[-14,-2.5],[-26-Math.random()*8,0],[-14,2.5]]);g.fill();g.fillStyle=c}
g.fillRect(-14,-3.5,22,7);poly([[8,-3.5],[22,0],[8,3.5]]);g.fill();poly([[-14,-3.5],[-21,-9],[-8,-3.5]]);g.fill();poly([[-14,3.5],[-21,9],[-8,3.5]]);g.fill()}
else{poly(mir(HP[k]));g.fill();g.stroke();if(!o.ic){if(k!=='shahid'){g.fillStyle='rgba(170,210,255,.85)';g.beginPath();g.ellipse(9,0,7,2.4,0,0,TAU);g.fill()}
g.fillStyle='rgba(255,170,60,'+(.6+.4*Math.random())+')';g.beginPath();g.arc(HP[k][HP[k].length-1][0]-3,0,3,0,TAU);g.fill()}}}
const CB=['#8aa3c9','#1f2a38'],CR=['#c98a8a','#3a1f1f'];
function drawHQ(h,t){g.save();g.translate(h.x,h.y);const c=h.s?'#ff5a4f':'#4f8dff';g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(5,6,52,0,TAU);g.fill();
g.fillStyle='#39414a';g.beginPath();g.arc(0,0,50,0,TAU);g.fill();g.strokeStyle=c;g.lineWidth=4;g.stroke();g.fillStyle='#59626c';g.fillRect(-26,-26,52,52);g.fillStyle='#2b3138';g.fillRect(-18,-18,36,36);g.fillStyle=c;g.fillRect(-8,-8,16,16);
g.rotate(t*1.4);g.strokeStyle='#cfd6dd';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(34,0);g.stroke();g.restore();
g.fillStyle='rgba(0,0,0,.5)';g.fillRect(h.x-40,h.y-72,80,7);g.fillStyle=c;g.fillRect(h.x-40,h.y-72,80*Math.max(0,h.hp/h.m),7)}
function draw(t){g.setTransform(1,0,0,1,0,0);g.fillStyle='#0b3a5c';g.fillRect(0,0,cv.width,cv.height);
const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;shake*=.9;g.setTransform(sc,0,0,sc,ox*sc+sx,sy);
g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(tc,0,0,W,H);g.drawImage(det,0,0);g.drawImage(scar,0,0);for(const q of WS){g.fillStyle='rgba(255,255,255,'+Math.max(0,Math.sin(t*1.6+q[2]))*.35+')';g.fillRect(q[0],q[1],7,1.4)}
if(mode!=='menu'){hq.forEach(h=>drawHQ(h,t));
for(const u of U){const air=TY[u.k].dom==='a';g.save();g.translate(u.x+(air?12:3),u.y+(air?16:3));g.rotate(u.a);g.globalAlpha=air?.22:.3;shape(u.k,'#000','#000',{t:u.t,ta:u.ta-u.a});g.restore()}
for(const u of U){const C=u.s?CR:CB;g.save();g.translate(u.x,u.y);g.rotate(u.a);shape(u.k,C[0],C[1],{t:u.t,ta:u.ta-u.a});g.restore();
if(u.hp<u.m){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(u.x-15,u.y-26,30,4);g.fillStyle=u.s?'#ff5a4f':'#4f8dff';g.fillRect(u.x-15,u.y-26,30*u.hp/u.m,4)}}
for(const p of P){if(p.t==='b'){g.strokeStyle='rgba(255,214,110,'+p.l/.09+')';g.lineWidth=2;g.beginPath();g.moveTo(p.x1,p.y1);g.lineTo(p.x2,p.y2);g.stroke()}
else if(p.t==='m'){g.save();g.translate(p.x,p.y);g.rotate(p.a||0);shape(p.bomb?'cab':'rocket','#d8dde2','#222',{});g.restore()}
else{const r=280*(.6+.4*Math.sin(t*14));g.strokeStyle='rgba(255,60,50,.9)';g.lineWidth=3;g.setLineDash([14,10]);g.beginPath();g.arc(p.tx,p.ty,r,0,TAU);g.stroke();g.setLineDash([]);g.fillStyle='rgba(255,60,50,.12)';g.fill()}}
for(const f of F){const u=f.l/f.m;if(f.k==='f'){g.fillStyle=`rgba(255,${180*u|0},${40*u|0},${u*.85})`;g.beginPath();g.arc(f.x,f.y,f.r*(1.3-u*.4),0,TAU);g.fill()}
else if(f.k==='s'||f.k==='d'){g.fillStyle=`rgba(${f.k==='d'?'150,125,90':'230,230,230'},${u*(f.k==='d'?.3:.5)})`;g.beginPath();g.arc(f.x,f.y,f.r+(1-u)*8,0,TAU);g.fill()}
else{g.strokeStyle=`rgba(255,230,180,${u})`;g.lineWidth=4;g.beginPath();g.arc(f.x,f.y,f.r*(1-u*.9),0,TAU);g.stroke()}}}
for(const c of CL){const x=(c.x+t*c.v)%(W+500)-250,q=g.createRadialGradient(x,c.y,0,x,c.y,c.r);q.addColorStop(0,'rgba(255,255,255,.2)');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(x-c.r,c.y-c.r,c.r*2,c.r*2)}
if(armed&&mode==='play'){const r=STR[armed],{x,y}=ms;g.strokeStyle='rgba(255,70,60,.95)';g.lineWidth=2.5;g.setLineDash([8,6]);g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();g.setLineDash([]);g.beginPath();g.moveTo(x-12,y);g.lineTo(x+12,y);g.moveTo(x,y-12);g.lineTo(x,y+12);g.stroke()}
{const vg=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,Math.max(W,H)*.7);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,10,25,.4)');g.fillStyle=vg;g.fillRect(-ox,0,cv.width/sc,H)}
if(flash>0){g.setTransform(1,0,0,1,0,0);g.fillStyle=`rgba(255,255,255,${flash})`;g.fillRect(0,0,cv.width,cv.height);flash-=.02}}
function drawIcon(c,k){const x=c.getContext('2d'),T=TY[k];x.translate(84,62);g=x;
if(T.st){x.fillStyle='#fff';x.beginPath();x.arc(0,0,50,0,TAU);x.fill()}

function sel(){KEYS.forEach(k=>{const e=TY[k].el;e.classList.toggle('sel',armed===k);e.classList.toggle('off',mode!=='play'||cash[0]<TY[k].c)});
$('cash').textContent=Math.floor(cash[0]).toLocaleString('en');$('inc').textContent='+'+INC+'/с';if(hq.length){$('b0').style.width=Math.max(0,hq[0].hp/30)+'%';$('b1').style.width=Math.max(0,hq[1].hp/30)+'%'}}

$('play').onclick=()=>{if(mode==='pause')resume();else{if(mode==='over')gen();start()}};

addEventListener('resize',()=>{if(mode==='menu')gen();else fit()});
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;tt=t/1000;if(mode==='play')tick(dt);if(AC)eng();sel();draw(tt);requestAnimationFrame(loop)}
gen();showMenu('IRON <span>WAR</span>',null,'Грати');requestAnimationFrame(loop);
